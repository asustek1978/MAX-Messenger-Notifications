send_message:
  name: Отправить сообщение
  description: Отправляет текстовое сообщение через MAX.
  fields:
    config_entry_id:
      required: false
      selector:
        config_entry:
          integration: max_messenger
    message:
      name: Сообщение
      required: true
      selector:
        text:
          multiline: true
    chat_id:
      name: Chat ID
      required: false
      selector:
        number:
          mode: box
    user_id:
      name: User ID
      required: false
      selector:
        number:
          mode: box
    format:
      name: Формат
      required: false
      default: markdown
      selector:
        select:
          options:
            - markdown
            - html
            - plain
    notify:
      name: Уведомлять
      required: false
      default: true
      selector:
        boolean:
    disable_link_preview:
      name: Отключить превью ссылок
      required: false
      default: false
      selector:
        boolean:
    buttons:
      name: Кнопки
      required: false
      selector:
        object:

