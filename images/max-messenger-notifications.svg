<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">MAX Messenger Notifications for Home Assistant</title>
  <desc id="desc">MAX Messenger Notifications — Home Assistant integration with emergency channel, message updates and HA/VK fallback</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="0.55" stop-color="#111443"/>
      <stop offset="1" stop-color="#311059"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#168CFF"/>
      <stop offset="0.55" stop-color="#5B4BF6"/>
      <stop offset="1" stop-color="#B536E8"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31215E"/>
      <stop offset="1" stop-color="#511A70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="745" cy="60" r="170" fill="#6727d8" opacity="0.12"/>
  <circle cx="1040" cy="350" r="210" fill="#1f5bff" opacity="0.10"/>

  <!-- App icon -->
  <g transform="translate(54 50)" filter="url(#shadow)">
    <rect width="128" height="128" rx="34" fill="url(#brand)"/>
    <path d="M35 36c0-9 7-16 16-16h39c9 0 16 7 16 16v30c0 9-7 16-16 16H66L44 101l5-19c-8-1-14-8-14-16V36z" fill="#fff"/>
    <circle cx="60" cy="52" r="5" fill="#6547ef"/>
    <circle cx="77" cy="52" r="5" fill="#6547ef"/>
    <circle cx="94" cy="52" r="5" fill="#6547ef"/>
  </g>

  <text x="218" y="100" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="800">MAX</text>
  <text x="218" y="151" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">Messenger Notifications</text>
  <text x="58" y="214" fill="#c9d4ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24">Уведомления и управление Home Assistant через MAX Messenger</text>

  <!-- Feature chips -->
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#fff">
    <g transform="translate(58 250)"><rect width="174" height="76" rx="18" fill="url(#chip)"/><circle cx="28" cy="28" r="13" fill="#8d63ff"/><path d="M21 24h14v10H28l-5 4 1-4h-3z" fill="#fff"/><text x="52" y="31">Текстовые</text><text x="52" y="54" fill="#bfc9e8">уведомления</text></g>
    <g transform="translate(244 250)"><rect width="158" height="76" rx="18" fill="url(#chip)"/><circle cx="28" cy="28" r="13" fill="#8d63ff"/><rect x="21" y="24" width="14" height="10" rx="2" fill="none" stroke="#fff" stroke-width="2"/><circle cx="28" cy="29" r="3" fill="#fff"/><text x="52" y="31">Фото и</text><text x="52" y="54" fill="#bfc9e8">видео</text></g>
    <g transform="translate(414 250)"><rect width="190" height="76" rx="18" fill="url(#chip)"/><circle cx="28" cy="28" r="13" fill="#8d63ff"/><path d="M22 34l3-8 9-9 5 5-9 9-8 3z" fill="#fff"/><text x="52" y="31">Редактирование</text><text x="52" y="54" fill="#bfc9e8">сообщений</text></g>
    <g transform="translate(616 250)"><rect width="170" height="76" rx="18" fill="url(#chip)"/><circle cx="28" cy="28" r="13" fill="#8d63ff"/><path d="M28 18l9 4v7c0 7-4 11-9 14-5-3-9-7-9-14v-7z" fill="none" stroke="#fff" stroke-width="2"/><text x="52" y="31">Аварийный</text><text x="52" y="54" fill="#bfc9e8">канал</text></g>
    <g transform="translate(798 250)"><rect width="185" height="76" rx="18" fill="url(#chip)"/><circle cx="28" cy="28" r="13" fill="#8d63ff"/><path d="M20 28a8 8 0 1 1 2 6" fill="none" stroke="#fff" stroke-width="2"/><path d="M19 34l6 1-1-6" fill="#fff"/><text x="52" y="31">Резервные</text><text x="52" y="54" fill="#bfc9e8">HA Push / VK</text></g>
  </g>

  <!-- Phone preview -->
  <g transform="translate(974 35)" filter="url(#shadow)">
    <rect width="190" height="350" rx="36" fill="#090f18" stroke="#526078" stroke-width="4"/>
    <rect x="12" y="18" width="166" height="314" rx="26" fill="#101a2a"/>
    <rect x="68" y="10" width="54" height="8" rx="4" fill="#313b4c"/>
    <text x="28" y="55" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">MAX Bot</text>
    <rect x="24" y="78" width="142" height="96" rx="16" fill="#3a1f2d"/>
    <text x="36" y="103" fill="#ff654f" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">🚨 АВАРИЯ · ДЫМ</text>
    <text x="36" y="129" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13">Кухня</text>
    <text x="36" y="151" fill="#c9d4ef" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Уведомление отправлено</text>
    <rect x="24" y="190" width="142" height="76" rx="16" fill="#17243a"/>
    <text x="36" y="217" fill="#79b8ff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">♻ Обновление</text>
    <text x="36" y="240" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Статус изменён</text>
    <rect x="24" y="282" width="142" height="34" rx="12" fill="#40215d"/>
    <text x="95" y="304" fill="#fff" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Управление домом</text>
  </g>

  <text x="58" y="380" fill="#8290b3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Home Assistant · HACS · MAX Bot API · v0.7.0</text>
</svg>
